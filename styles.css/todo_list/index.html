<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <fieldset class="base-field">
    <h1 class="heading">To-Do List</h1>
    <ul class="todo-list">
        <fieldset class="field">
        <li>
        <input type="checkbox" id="checkbox">
            <label for="checkbox" class="checkbox">Learn Html</label>
            <ul class="sub-item">
                <li>
                <a href="https://example.com" class="sub-item-link" target="_blank">html begineer tutorial</a>
                </li>
            </ul>
        </li>
        </fieldset>
        <fieldset class="field">
        <li>
           <input type="checkbox" id="checkbox">
            <label for="checkbox" class="checkbox">Learn Css</label>
            <ul class="sub-item">
                <li>
                <a href="https://example.com" class="sub-item-link" target="_blank">css begineer tutorial</a>
                </li>
            </ul>
        </li>
        </fieldset>
        <fieldset class="field">
        <li>
            <input type="checkbox" id="checkbox">
            <label for="checkbox" class="checkbox">Learn Javascript</label>
            <ul class="sub-item">
                <li>
                <a href="https://example.com" class="sub-item-link" target="_blank">js begineer tutorial</a>
                </li>
            </ul>
        </li>
        </fieldset>
        <fieldset class="field">
        <li>
           <input type="checkbox" id="checkbox">
            <label for="checkbox" class="checkbox">Learn Python</label>
            <ul class="sub-item">
                <li>
                <a href="https://example.com" class="sub-item-link" target="_blank">python begineer tutorial</a>
                </li>
            </ul>
        </li>
        </fieldset>
    </ul>
    </fieldset>
</body>
</html>
